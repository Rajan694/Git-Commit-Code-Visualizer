name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-check, lint and bundle.
      - run: npm run compile

      # Extension tests run inside a downloaded VS Code; Linux needs a virtual display.
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

      # Build the .vsix with both package scripts, so both stay working.
      - name: Package (bash)
        if: runner.os != 'Windows'
        run: bash scripts/package.sh
      - name: Package (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload .vsix
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: releases/*.vsix
          if-no-files-found: error

  # Telegram message when the run ends (success, failure or cancelled).
  # Reusable workflow + secrets: https://github.com/Rajan694/github-actions
  notify:
    name: Telegram Notification
    if: always()
    needs: [build]
    uses: Rajan694/github-actions/.github/workflows/telegram-notify.yml@v1
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
      workflow_name: ${{ github.workflow }}
      repository: ${{ github.repository }}
      branch: ${{ github.head_ref || github.ref_name }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      actor: ${{ github.actor }}
      is_deployment: false
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
